# vibeMemory — Docker Compose full stack
# Usage: docker compose up -d
#
# Required env vars (set in .env or export before running):
#   VIBEMEMORY_API_KEY  — Bearer token for MCP server
#   DASHBOARD_PASSWORD  — Password for the dashboard login page
#   STORAGE_SECRET      — Secret used to sign NiceGUI session cookies

services:

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10

  memory-server:
    build:
      context: .
      dockerfile: Containerfile
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      SIMILARITY_THRESHOLD: "0.92"
      MAX_TEXT_LEN: "2000"
      VIBEMEMORY_API_KEY: ${VIBEMEMORY_API_KEY}
    depends_on:
      qdrant:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Containerfile
    ports:
      - "8080:8080"
    environment:
      QDRANT_URL: http://qdrant:6333
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
      STORAGE_SECRET: ${STORAGE_SECRET}
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  qdrant_data:
